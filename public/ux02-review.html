<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX-02 responsive verification</title><style>body{margin:0;font:16px Arial;background:#e4e7ec}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}button,input,select{min-height:44px}iframe{display:block;border:0;background:white;height:900px;max-width:none}</style><header><label>Width <select id="width"><option>320</option><option selected>390</option><option>1440</option></select></label><label>Language <select id="lang"><option>en</option><option>ru</option><option>tg</option></select></label><button id="apply">Apply</button><span>Responsive review harness · synthetic D only</span></header><iframe title="D viewport" width="390" src="/"></iframe><script>document.getElementById('apply').onclick=()=>{const f=document.querySelector('iframe');f.width=document.getElementById('width').value;const l=document.getElementById('lang').value;f.src=l==='en'?'/':'/'+l;};</script></html>
