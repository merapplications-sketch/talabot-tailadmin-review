name: TailAdmin original build verification
on:
  push:
    branches: [review/cloudflare-vinext]
  workflow_dispatch:
jobs:
  verify-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Record pinned upstream
        run: |
          git merge-base --is-ancestor 1ef305c5b1332c899c5ffdeb72b56235d42d6d00 HEAD
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='2.5.0'||l.version!=='2.5.0')process.exit(1);console.log('TailAdmin version:',p.version,'lockfile:',l.lockfileVersion)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build original Next.js app
        run: npm run build
      - name: Check Cloudflare vinext compatibility
        run: npx --yes vinext check
