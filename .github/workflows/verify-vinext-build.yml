name: TailAdmin vinext adapter build verification
on:
  push:
    branches: [review/cloudflare-vinext]
  workflow_dispatch:
jobs:
  vinext-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Align Babel peer requirement for vinext adapter only
        run: npm install --save-dev '@babel/core@^7.29.0' --no-audit --no-fund
      - name: Generate isolated Cloudflare adapter configuration
        run: npx --yes vinext init --platform=cloudflare --name talabot-tailadmin-review --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Build Cloudflare vinext output
        run: npm run build:vinext
      - name: Preserve verified adapter configuration on review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json package-lock.json cloudflare.config.ts vite.config.ts
          git diff --cached --quiet || git commit -m "Record verified vinext adapter configuration [skip ci]"
          git push origin HEAD:review/cloudflare-vinext
      - name: Archive adapter-only changes and build output
        if: always()
        run: |
          git diff > vinext-adapter.patch || true
          git status --short > vinext-worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vinext-adapter-diagnostics
          path: |
            vinext-adapter.patch
            vinext-worktree-status.txt
          retention-days: 7
